services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: consensusux
      POSTGRES_PASSWORD: consensusux
      POSTGRES_DB: consensusux
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U consensusux"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
